<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Gallery | Imperial Collection</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }

        /* Загрузочный экран (GitHub-friendly) */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1e29 0%, #050608 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 1.2s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        
        .logo {
            font-family: 'Cormorant Garamond', serif;
            color: #d4af37; font-size: 3rem; letter-spacing: 10px;
            text-transform: uppercase; margin-bottom: 20px; text-align: center;
        }

        .enter-btn {
            padding: 15px 40px; background: none; border: 1px solid #d4af37;
            color: #d4af37; cursor: pointer; text-transform: uppercase;
            letter-spacing: 4px; transition: 0.4s; opacity: 0; transform: translateY(20px);
        }
        .enter-btn.visible { opacity: 1; transform: translateY(0); }
        .enter-btn:hover { background: #d4af37; color: #000; box-shadow: 0 0 20px #d4af37; }

        /* Кастомный курсор */
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 1px solid white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 100; mix-blend-mode: difference;
        }

        /* Информационная панель (Glassmorphism) */
        #painting-info {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            width: 80%; max-width: 600px; background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(15px); border: 1px solid #d4af37; border-radius: 10px;
            padding: 40px; color: #eee; display: none; z-index: 10000; opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #painting-info.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #painting-info h2 { font-family: 'Cormorant Garamond', serif; color: #d4af37; font-size: 2.2rem; margin-bottom: 10px; }
        #painting-info .artist { color: #8a96a3; margin-bottom: 20px; font-style: italic; }
        #painting-info .desc { line-height: 1.6; font-size: 0.95rem; max-height: 300px; overflow-y: auto; padding-right: 10px; }
        .close-btn { position: absolute; top: 15px; right: 20px; color: #d4af37; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="logo">VR EXHIBITION</div>
        <button class="enter-btn" id="enter-btn" onclick="startExperience()">Войти в галерею</button>
    </div>

    <div id="crosshair"></div>
    <div id="painting-info">
        <div class="close-btn" onclick="closeInfo()">×</div>
        <h2 id="info-title">Title</h2>
        <div class="artist" id="info-artist">Artist</div>
        <div class="desc" id="info-desc">Description</div>
    </div>

    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_b2820d883b.mp3?filename=ambient-classical-guitar-144998.mp3" type="audio/mpeg">
    </audio>

    <a-scene 
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;"
        shadow="type: pcfsoft"
        fog="type: exponential; color: #050608; density: 0.02"
        loading-screen="enabled: false">
        
        <a-assets>
            <img id="wall-tex" src="https://www.transparenttextures.com/patterns/dark-leather.png">
            <img id="floor-tex" src="https://www.transparenttextures.com/patterns/dark-wood.png">
        </a-assets>

        <a-entity id="rig" movement-controls="speed: 0.2; constrainToNavMesh: false">
            <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: true">
                <a-cursor visible="false" raycaster="objects: .clickable"></a-cursor>
            </a-entity>
        </a-entity>

        <a-sky color="#020203"></a-sky>
        
        <a-plane rotation="-90 0 0" width="40" height="60" material="color: #111; src: #floor-tex; repeat: 10 10; roughness: 0.2; metalness: 0.5" shadow="receive: true"></a-plane>
        
        <a-box position="0 5 -25" width="30" height="10" depth="0.5" material="color: #1a1a1a; src: #wall-tex" shadow="receive: true"></a-box>
        <a-box position="-15 5 0" rotation="0 90 0" width="50" height="10" depth="0.5" material="color: #1a1a1a; src: #wall-tex" shadow="receive: true"></a-box>
        <a-box position="15 5 0" rotation="0 -90 0" width="50" height="10" depth="0.5" material="color: #1a1a1a; src: #wall-tex" shadow="receive: true"></a-box>
        
        <a-light type="ambient" color="#222" intensity="0.5"></a-light>
        <a-light type="point" position="0 8 0" intensity="1.2" distance="30" decay="2" castShadow="true"></a-light>

        <a-entity position="-14.7 3 -15" rotation="0 90 0">
            <a-box width="4.4" height="3.4" depth="0.2" material="color: #000"></a-box>
            <a-box width="4.2" height="3.2" depth="0.1" position="0 0 0.1" material="color: #d4af37; metalness: 0.8; roughness: 0.2"></a-box>
            <a-plane width="4" height="3" position="0 0 0.16" class="clickable"
                     material="src: https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/After_the_attack._Plevna%2C_1877-1878.jpg/1280px-After_the_attack._Plevna%2C_1877-1878.jpg; shader: standard; roughness: 0.5"
                     onclick="openInfo('После атаки', 'Василий Верещагин', 'Грандиозное полотно, изображающее реалии войны без прикрас...')">
            </a-plane>
            <a-light type="spot" color="#fff" intensity="2" position="0 2 3" target="-14.7 3 -15" angle="30"></a-light>
        </a-entity>

        </a-scene>

    <script>
        // Логика интерфейса
        function startExperience() {
            document.getElementById('loading-screen').classList.add('fade-out');
            document.getElementById('bgm').play();
            // Захват курсора
            document.querySelector('a-scene').canvas.requestPointerLock();
        }

        function openInfo(title, artist, desc) {
            document.getElementById('info-title').innerText = title;
            document.getElementById('info-artist').innerText = artist;
            document.getElementById('info-desc').innerText = desc;
            document.getElementById('painting-info').classList.add('active');
            document.exitPointerLock(); // Освобождаем мышь для чтения
        }

        function closeInfo() {
            document.getElementById('painting-info').classList.remove('active');
            document.querySelector('a-scene').canvas.requestPointerLock();
        }

        // Показ кнопки после загрузки ресурсов
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('enter-btn').classList.add('visible');
            }, 1500);
        });

        // Обработка наведения (Hover effect)
        const crosshair = document.getElementById('crosshair');
        document.addEventListener('mouseenter', (e) => {
            if (e.target.classList && e.target.classList.contains('clickable')) {
                crosshair.style.transform = 'translate(-50%, -50%) scale(2)';
                crosshair.style.borderColor = '#d4af37';
            }
        }, true);

        document.addEventListener('mouseleave', (e) => {
            if (e.target.classList && e.target.classList.contains('clickable')) {
                crosshair.style.transform = 'translate(-50%, -50%) scale(1)';
                crosshair.style.borderColor = 'white';
            }
        }, true);
    </script>
</body>
</html>
