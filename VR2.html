<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Музей — Крепость Анапа</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #080d1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #c07840;
            font-family: 'Inter', sans-serif;
            font-size: 24px;
        }
        .loading-spinner {
            border: 4px solid rgba(192,120,64,0.3);
            border-top: 4px solid #c07840;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="loading-spinner"></div>
        <span>Загрузка VR-сцены...</span>
    </div>

    <a-scene 
        vr-mode-ui="enabled: true"
        renderer="colorManagement: true; physicallyCorrectLights: true;"
        loading-screen="enabled: false"
        inspector="url:./vendor/aframe-inspector.min.js"
    >
        <!-- Панорама крепости -->
        <a-sky 
            id="panorama"
            src="#castle-img"
            rotation="0 -90 0"
        ></a-sky>

        <!-- Текстура панорамы загружается через ассеты -->
        <a-assets>
            <img id="castle-img" src="./assets/panorama_castle.jpg" crossorigin="anonymous">
            
            <!-- Модели для интерактивных элементов -->
            <a-asset-item id="tower-model" src="./models/tower.gltf"></a-asset-item>
            <a-asset-item id="cannon-model" src="./models/cannon.gltf"></a-asset-item>
        </a-assets>

        <!-- Основной свет -->
        <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8; position: -0.5 -1 0.5"></a-entity>

        <!-- Камера с контролами -->
        <a-entity 
            id="cameraRig"
            position="0 1.6 0"
        >
            <a-entity 
                id="camera"
                camera 
                look-controls="pointerLockEnabled: true"
                wasd-controls="acceleration: 50"
                position="0 0 0"
            ></a-entity>
            
            <!-- Лазерный указатель для взаимодействия -->
            <a-entity 
                laser-controls="hand: right"
                raycaster="objects: .interactable; far: 10; interval: 0"
            ></a-entity>
        </a-entity>

        <!-- Интерактивные точки интереса -->
        <a-entity 
            class="interactable"
            position="-2 1 -3"
            geometry="primitive: circle; radius: 0.2"
            material="color: #c07840; shader: flat"
            rotation="-90 0 0"
            event-set__enter="_event: mouseenter; material.color: #f0c8a0"
            event-set__leave="_event: mouseleave; material.color: #c07840"
        >
            <a-animation
                attribute="scale"
                dur="1000"
                to="1.2 1.2 1"
                direction="alternate"
                repeat="indefinite"
            ></a-animation>
            <a-text 
                value="Башня обороны" 
                align="center" 
                position="0 0.3 0"
                color="#fff"
                width="2"
            ></a-text>
        </a-entity>

        <a-entity 
            class="interactable"
            position="3 1 -1"
            geometry="primitive: circle; radius: 0.2"
            material="color: #c07840; shader: flat"
            rotation="-90 0 0"
            event-set__enter="_event: mouseenter; material.color: #f0c8a0"
            event-set__leave="_event: mouseleave; material.color: #c07840"
        >
            <a-animation
                attribute="scale"
                dur="1000"
                to="1.2 1.2 1"
                direction="alternate"
                repeat="indefinite"
            ></a-animation>
            <a-text 
                value="Пушка 18 века" 
                align="center" 
                position="0 0.3 0"
                color="#fff"
                width="2"
            ></a-text>
        </a-entity>

        <!-- Дополнительные декоративные элементы -->
        <a-entity 
            position="0 0 -5"
            gltf-model="#tower-model"
            scale="0.8 0.8 0.8"
            rotation="0 45 0"
        ></a-entity>

        <a-entity 
            position="4 0 -2"
            gltf-model="#cannon-model"
            scale="0.5 0.5 0.5"
            rotation="0 -30 0"
        ></a-entity>

        <!-- UI для десктопа -->
        <a-entity 
            id="ui-overlay"
            visible="false"
            position="0 0 -1"
            text="value: Нажмите пробел для входа в VR\nWASD для движения\nМышь для осмотра; align: center; width: 10; color: white"
        ></a-entity>
    </a-scene>

    <script>
        // Скрытие загрузочного экрана после полной загрузки сцены
        AFRAME.registerComponent('hide-loading', {
            init: function() {
                const loadingEl = document.querySelector('.loading');
                this.el.sceneEl.addEventListener('renderstart', () => {
                    setTimeout(() => {
                        loadingEl.style.opacity = '0';
                        loadingEl.style.transition = 'opacity 1s ease-out';
                        setTimeout(() => {
                            loadingEl.style.display = 'none';
                        }, 1000);
                    }, 500);
                });
            }
        });

        // Добавляем компонент к сцене
        document.querySelector('a-scene').setAttribute('hide-loading', '');

        // Обработка событий для интерактивных элементов
        document.querySelectorAll('.interactable').forEach(el => {
            el.addEventListener('click', function() {
                const textValue = this.querySelector('a-text').getAttribute('value');
                alert(`Информация: ${textValue}\nЭтот элемент доступен в полноэкранном VR-режиме.`);
            });
        });

        // Отображение UI-подсказок для десктопных пользователей
        window.addEventListener('load', () => {
            const scene = document.querySelector('a-scene');
            const uiOverlay = document.querySelector('#ui-overlay');
            
            if (!AFRAME.utils.device.isMobile() && !AFRAME.utils.device.checkHeadsetConnected()) {
                uiOverlay.setAttribute('visible', 'true');
            }
        });
    </script>
</body>
</html>
