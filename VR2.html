<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Музей — Виртуальная Галерея</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="exhibit-manager.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 1s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        #loading-screen h1 {
            color: #e0c97f; font-size: 2.5rem; margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(224,201,127,0.5);
            letter-spacing: 4px;
        }
        #loading-screen p { color: #aaa; font-size: 1rem; margin-bottom: 30px; }
        .loader {
            width: 60px; height: 60px; border: 3px solid rgba(224,201,127,0.2);
            border-top: 3px solid #e0c97f; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .enter-btn {
            margin-top: 30px; padding: 15px 40px; background: linear-gradient(135deg, #c9a84c, #e0c97f);
            color: #1a1a2e; border: none; border-radius: 8px; font-size: 1.1rem;
            cursor: pointer; font-weight: bold; letter-spacing: 2px;
            display: none; transition: transform 0.3s;
        }
        .enter-btn:hover { transform: scale(1.05); }

        #info-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: white; padding: 12px 24px;
            border-radius: 12px; font-size: 0.9rem; z-index: 100;
            backdrop-filter: blur(10px); border: 1px solid rgba(224,201,127,0.3);
            pointer-events: none; text-align: center;
        }
        #info-panel span { color: #e0c97f; font-weight: bold; }

        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; z-index: 50; pointer-events: none; opacity: 0.6;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white;
        }
        #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
        #crosshair::after { width: 20px; height: 2px; top: 9px; left: 0; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 2000;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.5s ease;
            backdrop-filter: blur(8px);
        }
        #modal-overlay.active { display: flex; opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: linear-gradient(135deg, #0f111a 0%, #161b2c 100%);
            border: 1px solid #c9a84c; border-radius: 4px; padding: 0;
            max-width: 700px; width: 90%; color: #f5f0e8; position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { background: linear-gradient(90deg, #1c2333, #151925); padding: 25px 40px; border-bottom: 1px solid #c9a84c; }
        .modal-title { font-family: serif; font-size: 2.2rem; color: #e0c97f; margin: 0; text-transform: uppercase; }
        .modal-body { padding: 40px; max-height: 60vh; overflow-y: auto; }
        .modal-desc { font-family: 'Georgia', serif; font-size: 1.1rem; line-height: 1.9; color: #d1d5db; text-align: justify; }
        .modal-close { position: absolute; top: 15px; right: 20px; color: #7a8ba6; font-size: 2.5rem; cursor: pointer; background: none; border: none; }
        .modal-close:hover { color: #e0c97f; }
        .modal-footer { padding: 15px 40px; background: #0d1017; border-top: 1px solid rgba(201, 168, 76, 0.2); font-size: 0.8rem; color: #556; text-align: center; }
    </style>
</head>
<body>
    <!-- Modal -->
    <div id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title" id="m-title">Название</h2>
                <div class="modal-artist" id="m-artist">Автор</div>
                <button class="modal-close" onclick="closeModalDirect()">×</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc" id="m-desc">Описание...</p>
            </div>
            <div class="modal-footer">Виртуальный Музей • Анапа 2024</div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1>🏛️ VR МУЗЕЙ</h1>
        <div class="loader"></div>
        <button class="enter-btn" id="enter-btn" onclick="enterMuseum()">ВОЙТИ В МУЗЕЙ</button>
    </div>

    <div id="crosshair"></div>
    <div id="info-panel"><span>WASD</span> — движение | <span>Мышь</span> — осмотр</div>

    <script>
    function showPaintingInfo(title, artist, desc) {
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-artist').innerText = artist;
        document.getElementById('m-desc').innerHTML = desc;
        const overlay = document.getElementById('modal-overlay');
        overlay.style.display = 'flex';
        requestAnimationFrame(() => overlay.classList.add('active'));
        if (document.pointerLockElement) document.exitPointerLock();
    }

    function closeModalDirect() {
        const overlay = document.getElementById('modal-overlay');
        overlay.classList.remove('active');
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
    }

    function closeModal(e) { if (e.target.id === 'modal-overlay') closeModalDirect(); }

    AFRAME.registerComponent('auto-frame', {
        schema: {
            url: {type: 'string'},
            title: {type: 'string'},
            artist: {type: 'string'},
            description: {type: 'string'},
            maxWidth: {type: 'number', default: 4.0},
            maxHeight: {type: 'number', default: 3.5}
        },
        init: function () {
            const data = this.data;
            const img = new Image();
            img.onload = () => this.buildFrame(img.naturalWidth / img.naturalHeight, data, true, img);
            img.onerror = () => this.buildFrame(1, data, false, null);
            img.src = data.url;
        },
        buildFrame: function (aspect, data, hasImage, imgElement) {
            const el = this.el;
            let w = Math.min(data.maxWidth, data.maxHeight * aspect);
            let h = w / aspect;
            
            // Frame
            const frame = document.createElement('a-box');
            frame.setAttribute('width', w + 0.3);
            frame.setAttribute('height', h + 0.3);
            frame.setAttribute('depth', 0.1);
            frame.setAttribute('material', 'color: #DAA520; metalness: 0.7; roughness: 0.3');
            el.appendChild(frame);

            // Canvas
            const canvas = document.createElement('a-plane');
            canvas.setAttribute('width', w);
            canvas.setAttribute('height', h);
            canvas.setAttribute('position', '0 0 0.06');
            canvas.setAttribute('class', 'clickable');
            
            if (hasImage) {
                const tex = new THREE.Texture(imgElement);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;
                canvas.addEventListener('loaded', () => {
                    canvas.getObject3D('mesh').material = new THREE.MeshBasicMaterial({map: tex});
                });
                canvas.addEventListener('click', () => showPaintingInfo(data.title, data.artist, data.description));
            }
            el.appendChild(canvas);

            // Label
            const label = document.createElement('a-entity');
            label.setAttribute('position', `0 ${-h/2 - 0.4} 0.05`);
            label.setAttribute('geometry', 'primitive: plane; width: 1.5; height: 0.4');
            label.setAttribute('material', 'color: #1a1a1a');
            const txt = document.createElement('a-text');
            txt.setAttribute('value', data.title);
            txt.setAttribute('align', 'center');
            txt.setAttribute('width', 3);
            txt.setAttribute('position', '0 0 0.01');
            label.appendChild(txt);
            el.appendChild(label);
        }
    });

    AFRAME.registerComponent('dust-particles', {
        init: function () {
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('a-sphere');
                p.setAttribute('radius', 0.01);
                p.setAttribute('position', `${(Math.random()-0.5)*30} ${Math.random()*8} ${(Math.random()-0.5)*50}`);
                p.setAttribute('material', 'color: #FFF; opacity: 0.2; transparent: true');
                this.el.appendChild(p);
            }
        }
    });
    </script>

    <a-scene renderer="antialias: true; colorManagement: true" fog="type: exponential; color: #1a1a2e; density: 0.01">
        <a-assets></a-assets>

        <a-sky color="#0d1117"></a-sky>
        
        <!-- Environment -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="50" material="color: #2a1f14; roughness: 0.8"></a-plane>
        <a-plane position="0 8 0" rotation="90 0 0" width="30" height="50" material="color: #f5f0e8"></a-plane>

        <!-- Walls -->
        <a-plane position="-15 4 0" rotation="0 90 0" width="50" height="8" material="color: #2c3e50"></a-plane>
        <a-plane position="15 4 0" rotation="0 -90 0" width="50" height="8" material="color: #2c3e50"></a-plane>
        <a-plane position="0 4 -25" rotation="0 0 0" width="30" height="8" material="color: #2c3e50"></a-plane>

        <!-- LEFT WALL -->
        <a-entity position="-14.8 3 -20" rotation="0 90 0" auto-frame="url: https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/After_the_attack._Plevna%2C_1877-1878.jpg/1280px-After_the_attack._Plevna%2C_1877-1878.jpg; title: После атаки; artist: В. Верещагин; description: Полотно Русско-турецкой войны."></a-entity>
        
        <a-entity position="-14.8 3 -12" rotation="0 90 0" auto-frame="url: https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Vasily_Vereshchagin_01.JPG/800px-Vasily_Vereshchagin_01.JPG; title: Василий Верещагин; artist: Биография; description: Великий русский баталист."></a-entity>
        
        <a-entity position="-14.8 3 -4" rotation="0 90 0" auto-frame="url: IMG_2346.jpeg; title: Памятник Гудовичу; artist: Анапа; description: Памятник основателю города."></a-entity>
        
        <a-entity position="-14.8 3 4" rotation="0 90 0" auto-frame="url: IMG_2348.jpeg; title: Триумфальная арка; artist: Архитектура; description: Символ города Анапа."></a-entity>
        
        <a-entity position="-14.8 3 12" rotation="0 90 0" auto-frame="url: IMG_2350.jpeg; title: Русские ворота; artist: История; description: Остатки турецкой крепости."></a-entity>
        
        <a-entity position="-14.8 3 20" rotation="0 90 0" auto-frame="url: горгиппия.jpg; title: Горгиппия; artist: Музей; description: Античное наследие Анапы."></a-entity>

        <!-- RIGHT WALL -->
        <a-entity position="14.8 3 -20" rotation="0 -90 0" auto-frame="url: IMG_2339.jpeg; title: Набережная; artist: Вид; description: Красивый вид на море."></a-entity>
        
        <a-entity position="14.8 3 -12" rotation="0 -90 0" auto-frame="url: фото дроп 4.jpg; title: Анапа с высоты; artist: Дрон; description: Панорамный вид на побережье."></a-entity>
        
        <a-entity position="14.8 3 -4" rotation="0 -90 0" auto-frame="url: IMG_2346.jpeg; title: Сквер; artist: Анапа; description: Городские пейзажи."></a-entity>
        
        <a-entity position="14.8 3 4" rotation="0 -90 0" auto-frame="url: IMG_2348.jpeg; title: Площадь; artist: Центр; description: Центральная часть города."></a-entity>
        
        <a-entity position="14.8 3 12" rotation="0 -90 0" auto-frame="url: IMG_2350.jpeg; title: Архитектура; artist: Детали; description: Фрагменты исторических зданий."></a-entity>
        
        <a-entity position="14.8 3 20" rotation="0 -90 0" auto-frame="url: IMG_2339.jpeg; title: Вечерняя Анапа; artist: Фото; description: Дубликат изображения для симметрии."></a-entity>

        <!-- Lights -->
        <a-light type="ambient" intensity="0.7"></a-light>
        <a-light type="point" position="0 5 0" intensity="1"></a-light>
        <a-entity dust-particles></a-entity>

        <!-- Player -->
        <a-entity id="rig" position="0 0 22" rotation="0 180 0">
            <a-entity camera look-controls="pointerLockEnabled: true" wasd-controls="acceleration: 60" position="0 1.7 0">
                <a-cursor color="#e0c97f"></a-cursor>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const enterBtn = document.getElementById('enter-btn');
        scene.addEventListener('loaded', () => { 
            enterBtn.style.display = 'block'; 
            document.querySelector('.loader').style.display = 'none';
        });

        function enterMuseum() {
            document.getElementById('loading-screen').classList.add('fade-out');
            scene.canvas.requestPointerLock();
        }
    </script>
</body>
</html>
