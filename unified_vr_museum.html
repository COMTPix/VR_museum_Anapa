<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Музей — Виртуальная Галерея</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 1s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        #loading-screen h1 {
            color: #e0c97f; font-size: 2.5rem; margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(224,201,127,0.5);
            letter-spacing: 4px;
        }
        #loading-screen p { color: #aaa; font-size: 1rem; margin-bottom: 30px; }
        .loader {
            width: 60px; height: 60px; border: 3px solid rgba(224,201,127,0.2);
            border-top: 3px solid #e0c97f; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .enter-btn {
            margin-top: 30px; padding: 15px 40px; background: linear-gradient(135deg, #c9a84c, #e0c97f);
            color: #1a1a2e; border: none; border-radius: 8px; font-size: 1.1rem;
            cursor: pointer; font-weight: bold; letter-spacing: 2px;
            display: none; transition: transform 0.3s;
        }
        .enter-btn:hover { transform: scale(1.05); }

        #info-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: white; padding: 12px 24px;
            border-radius: 12px; font-size: 0.9rem; z-index: 100;
            backdrop-filter: blur(10px); border: 1px solid rgba(224,201,127,0.3);
            pointer-events: none; text-align: center;
        }
        #info-panel span { color: #e0c97f; font-weight: bold; }

        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; z-index: 50; pointer-events: none; opacity: 0.6;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white;
        }
        #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
        #crosshair::after { width: 20px; height: 2px; top: 9px; left: 0; }

        #painting-info {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #e0c97f; padding: 14px 28px;
            border-radius: 10px; font-size: 1.1rem; z-index: 100;
            backdrop-filter: blur(10px); border: 1px solid rgba(224,201,127,0.4);
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
            text-align: center;
        }
        #painting-info.visible { opacity: 1; }

        /* Modal Styles - Premium Museum Look */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 2000;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.5s ease;
            backdrop-filter: blur(8px);
        }
        #modal-overlay.active { display: flex; opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: linear-gradient(135deg, #0f111a 0%, #161b2c 100%);
            border: 1px solid #c9a84c;
            border-radius: 4px;
            padding: 0;
            max-width: 700px;
            width: 90%;
            color: #f5f0e8;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(201, 168, 76, 0.15);
            text-align: left;
            overflow: hidden;
            display: flex; flex-direction: column;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            background: linear-gradient(90deg, #1c2333, #151925);
            padding: 25px 40px;
            border-bottom: 1px solid #c9a84c;
            position: relative;
        }
        .modal-title {
            font-family: 'Playfair Display', 'Times New Roman', serif;
            font-size: 2.2rem; color: #e0c97f; margin: 0;
            letter-spacing: 1px; text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .modal-artist {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.1rem; color: #aebfd6; margin-top: 8px;
            font-weight: 300; letter-spacing: 0.5px;
        }
        
        .modal-body {
            padding: 40px;
            max-height: 60vh;
            overflow-y: auto;
            background: radial-gradient(circle at top right, rgba(30, 41, 59, 0.3), transparent);
        }
        /* Custom Scrollbar */
        .modal-body::-webkit-scrollbar { width: 8px; }
        .modal-body::-webkit-scrollbar-track { background: #0f111a; }
        .modal-body::-webkit-scrollbar-thumb { background: #3e4c63; border-radius: 4px; }
        
        .modal-desc {
            font-family: 'Georgia', serif;
            font-size: 1.1rem; line-height: 1.9;
            color: #d1d5db; margin: 0;
            text-align: justify;
        }
        .modal-desc h3 {
            color: #e0c97f;
            font-family: 'Playfair Display', 'Times New Roman', serif;
            font-size: 1.3rem;
            margin: 20px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(224, 201, 127, 0.3);
            letter-spacing: 1px;
        }
        .modal-desc h3:first-child { margin-top: 0; }
        .modal-desc p {
            margin: 0 0 16px 0;
            text-indent: 1.5em;
        }
        .modal-desc p:last-child { margin-bottom: 0; }
        .modal-desc em {
            color: #a8c4e0;
            font-style: italic;
            background: rgba(168, 196, 224, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .modal-desc strong { color: #e0c97f; font-weight: 600; }

        .modal-close {
            position: absolute; top: 15px; right: 20px;
            color: #7a8ba6; font-size: 2.5rem; cursor: pointer;
            background: none; border: none; line-height: 1;
            transition: color 0.3s;
        }
        .modal-close:hover { color: #e0c97f; }

        .modal-footer {
            padding: 15px 40px;
            background: #0d1017;
            border-top: 1px solid rgba(201, 168, 76, 0.2);
            font-size: 0.8rem; color: #556;
            text-transform: uppercase; letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Info Modal -->
    <div id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title" id="m-title">Название картины</h2>
                <div class="modal-artist" id="m-artist">Автор, Год</div>
                <button class="modal-close" onclick="closeModalDirect()">×</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc" id="m-desc">Описание картины...</p>
            </div>
            <div class="modal-footer">
                Виртуальный Музей Искусств • Коллекция 2023
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1>🏛️ VR МУЗЕЙ</h1>
        <p>Виртуальная галерея искусств</p>
        <div class="loader"></div>
        <button class="enter-btn" id="enter-btn" onclick="enterMuseum()">ВОЙТИ В МУЗЕЙ</button>
    </div>

    <!-- UI Overlays -->
    <div id="crosshair"></div>
    <div id="info-panel">
        <span>WASD</span> — движение &nbsp;|&nbsp; <span>Мышь</span> — осмотр &nbsp;|&nbsp; <span>VR</span> — шлем
    </div>
    <div id="painting-info"></div>

    <script>
    // ============ GLOBAL MODAL FUNCTIONS ============
    function showPaintingInfo(title, artist, desc) {
        document.getElementById('m-title').innerText = title || "Без названия";
        document.getElementById('m-artist').innerText = artist || "Неизвестный автор";
        document.getElementById('m-desc').innerHTML = desc || "Информация скоро появится.";
        
        const overlay = document.getElementById('modal-overlay');
        overlay.style.display = 'flex';
        // Small delay to allow display:flex to apply before opacity transition
        requestAnimationFrame(() => {
            overlay.classList.add('active');
        });
        
        // Exit pointer lock so user can use mouse
        if (document.pointerLockElement) {
            document.exitPointerLock();
        }
    }

    function closeModal(e) {
        if (e.target.id === 'modal-overlay') {
            closeModalDirect();
        }
    }
    
    function closeModalDirect() {
        const overlay = document.getElementById('modal-overlay');
        overlay.classList.remove('active');
        setTimeout(() => {
            overlay.style.display = 'none';
            // Optional: return focus to canvas
            const scene = document.querySelector('a-scene');
            if (scene && scene.canvas) scene.canvas.focus();
        }, 300);
    }

    // ============ REGISTER auto-frame COMPONENT ============
    AFRAME.registerComponent('auto-frame', {
        schema: {
            url:       { type: 'string', default: '' },
            title:     { type: 'string', default: '' },
            artist:    { type: 'string', default: '' },
            description: { type: 'string', default: '' },
            maxWidth:  { type: 'number', default: 4.0 },
            maxHeight: { type: 'number', default: 3.5 },
            frameDepth:{ type: 'number', default: 0.18 }
        },

        init: function () {
            const data = this.data;

            if (data.url && data.url.length > 0) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const aspect = img.naturalWidth / img.naturalHeight;
                    this.buildFrame(aspect, data, true, img);
                };
                img.onerror = () => {
                    this.buildFrame(4/3, data, false, null);
                };
                img.src = data.url;
            } else {
                this.buildFrame(4/3, data, false, null);
            }
        },

        buildFrame: function (aspect, data, hasImage, imgElement) {
            const el = this.el;
            const maxW = data.maxWidth;
            const maxH = data.maxHeight;
            const fd = data.frameDepth;

            // Calculate canvas size
            let canvasW, canvasH;
            if (aspect >= 1) {
                canvasW = Math.min(maxW, maxH * aspect);
                canvasH = canvasW / aspect;
                if (canvasH > maxH) { canvasH = maxH; canvasW = canvasH * aspect; }
            } else {
                canvasH = Math.min(maxH, maxW / aspect);
                canvasW = canvasH * aspect;
                if (canvasW > maxW) { canvasW = maxW; canvasH = canvasW / aspect; }
            }

            const border = 0.25;
            const frameW = canvasW + border * 2;
            const frameH = canvasH + border * 2;

            // ---- LAYERS (Clean Z-separation) ----
            const outer = document.createElement('a-box');
            outer.setAttribute('width', frameW + 0.15);
            outer.setAttribute('height', frameH + 0.15);
            outer.setAttribute('depth', fd);
            outer.setAttribute('position', '0 0 0');
            el.appendChild(outer);
            outer.addEventListener('loaded', () => {
                const mesh = outer.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#6B4F1D', roughness: 0.25, metalness: 0.65 });
            });

            const mid = document.createElement('a-box');
            mid.setAttribute('width', frameW + 0.05);
            mid.setAttribute('height', frameH + 0.05);
            mid.setAttribute('depth', fd * 0.6);
            mid.setAttribute('position', '0 0 ' + (fd * 0.35));
            el.appendChild(mid);
            mid.addEventListener('loaded', () => {
                const mesh = mid.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#DAA520', roughness: 0.35, metalness: 0.55 });
            });

            const inner = document.createElement('a-box');
            inner.setAttribute('width', frameW - 0.05);
            inner.setAttribute('height', frameH - 0.05);
            inner.setAttribute('depth', fd * 0.4);
            inner.setAttribute('position', '0 0 ' + (fd * 0.55));
            el.appendChild(inner);
            inner.addEventListener('loaded', () => {
                const mesh = inner.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#8B6914', roughness: 0.25, metalness: 0.6 });
            });

            const lip = document.createElement('a-box');
            lip.setAttribute('width', canvasW + 0.08);
            lip.setAttribute('height', canvasH + 0.08);
            lip.setAttribute('depth', fd * 0.25);
            lip.setAttribute('position', '0 0 ' + (fd * 0.7));
            el.appendChild(lip);
            lip.addEventListener('loaded', () => {
                const mesh = lip.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#B8860B', roughness: 0.3, metalness: 0.7 });
            });

            // Canvas
            const canvasZ = fd * 0.95; 
            const canvas = document.createElement('a-plane');
            canvas.setAttribute('width', canvasW);
            canvas.setAttribute('height', canvasH);
            canvas.setAttribute('position', '0 0 ' + canvasZ);
            canvas.setAttribute('class', 'clickable'); // Enable raycasting
            
            // Interaction
            if (hasImage) {
                canvas.addEventListener('click', () => {
                    showPaintingInfo(data.title, data.artist, data.description);
                });
                
                canvas.addEventListener('mouseenter', () => {
                    document.body.style.cursor = 'pointer';
                    light.setAttribute('intensity', '3.5');
                });
                canvas.addEventListener('mouseleave', () => {
                    document.body.style.cursor = 'default';
                    light.setAttribute('intensity', '2.5');
                });
            }

            if (hasImage && imgElement) {
                const tex = new THREE.Texture(imgElement);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.minFilter = THREE.LinearMipmapLinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = true;
                tex.anisotropy = 16;
                tex.needsUpdate = true;

                canvas.addEventListener('loaded', () => {
                     const mesh = canvas.getObject3D('mesh');
                     if (mesh) {
                         mesh.material = new THREE.MeshBasicMaterial({
                             map: tex,
                             toneMapped: false,
                             side: THREE.DoubleSide
                         });
                     }
                 });
            } else {
                // Placeholder texture
                const placeholderCanvas = document.createElement('canvas');
                placeholderCanvas.width = 512;
                placeholderCanvas.height = 512;
                const ctx = placeholderCanvas.getContext('2d');
                
                // Background
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, 512, 512);
                
                // Frame border
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 20;
                ctx.strokeRect(20, 20, 472, 472);
                
                // Diagonal lines
                ctx.beginPath();
                ctx.moveTo(20, 20);
                ctx.lineTo(492, 492);
                ctx.moveTo(492, 20);
                ctx.lineTo(20, 492);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 10;
                ctx.stroke();
                
                // Text
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#666';
                ctx.fillText('КАРТИНА', 256, 230);
                ctx.fillText('СКОРО', 256, 270);

                const placeholderTex = new THREE.CanvasTexture(placeholderCanvas);
                placeholderTex.colorSpace = THREE.SRGBColorSpace;
                placeholderTex.minFilter = THREE.LinearFilter;
                
                canvas.addEventListener('loaded', () => {
                    const mesh = canvas.getObject3D('mesh');
                    if (mesh) {
                        mesh.material = new THREE.MeshBasicMaterial({
                            map: placeholderTex,
                            toneMapped: false,
                            side: THREE.DoubleSide
                        });
                    }
                });
            }

            // Add a subtle light for glow effect
            const light = document.createElement('a-entity');
            light.setAttribute('light', { type: 'point', intensity: 2.5, distance: 8, decay: 2 });
            light.setAttribute('position', '0 0 ' + (canvasZ + 0.5));
            el.appendChild(light);
            
            // Make canvas first in DOM for proper raycast target
            el.insertBefore(canvas, el.firstChild);
        }
    });

    // ============ SCENE SETUP ============
    document.addEventListener('DOMContentLoaded', () => {
        const scene = document.createElement('a-scene');
        scene.innerHTML = `
            <!-- Lighting -->
            <a-entity light="type: ambient; color: #BBB; intensity: 0.35"></a-entity>
            <a-entity light="type: directional; color: #fff; intensity: 0.8; castShadow: true;" position="-10 20 -10"></a-entity>
            <a-entity light="type: hemisphere; skyColor: #9dbdc6; groundColor: #ffead4; intensity: 0.3"></a-entity>

            <!-- Camera Rig with WASD Movement -->
            <a-entity id="rig" movement-controls="constrainToNavMesh: true; falling: true; speed: 3;">
                <a-entity id="head" 
                    position="0 1.6 0" 
                    camera look-controls="pointerLockEnabled: true"
                    wasd-controls="acceleration: 30"
                    universal-controls="movementSpeed: 3; fly: true;"
                    >
                    <a-entity
                        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03;"
                        material="color: #24CAFF; shader: flat; transparent: true; opacity: 0.5"
                        position="0 0 -0.4"
                        visible="false"
                        cursor="fuse: false; rayOrigin: mouse"
                        raycaster="objects: .clickable"
                        ></a-entity>
                </a-entity>
            </a-entity>

            <!-- Nav Mesh for Constrained Movement -->
            <a-entity id="nav-mesh" nav-mesh="static: true;"></a-entity>

            <!-- Gallery Structure -->
            <a-entity position="0 0 0">
                <!-- Main Hall Floor -->
                <a-box position="0 -0.05 0" width="30" depth="40" height="0.1" 
                       material="src: assets/textures/marble_floor.jpg; repeat: 6 8; roughness: 0.2; metalness: 0.1;"></a-box>
                
                <!-- Main Hall Ceiling -->
                <a-box position="0 6 -10" width="30" depth="40" height="0.2" 
                       material="color: #f0f0f0; roughness: 0.5; metalness: 0.1;"></a-box>
                
                <!-- Left Wall -->
                <a-box position="-15.05 3 -10" width="0.1" height="6" depth="40" 
                       material="color: #e8e8e8; roughness: 0.7; metalness: 0.05;"></a-box>
                
                <!-- Right Wall -->
                <a-box position="15.05 3 -10" width="0.1" height="6" depth="40" 
                       material="color: #e8e8e8; roughness: 0.7; metalness: 0.05;"></a-box>
                
                <!-- Back Wall -->
                <a-box position="0 3 -20.05" width="30" height="6" depth="0.1" 
                       material="color: #e8e8e8; roughness: 0.7; metalness: 0.05;"></a-box>
                
                <!-- Entrance Wall -->
                <a-box position="0 3 0.05" width="30" height="6" depth="0.1" 
                       material="color: #e8e8e8; roughness: 0.7; metalness: 0.05;"></a-box>
                
                <!-- Entrance Archway -->
                <a-box position="0 2.5 0" width="4" height="3" depth="0.1" 
                       material="color: #d8d8d8; roughness: 0.6; metalness: 0.1;"></a-box>
                
                <!-- Decorative Elements -->
                <a-circle position="0 5 -19.95" radius="0.8" rotation="90 0 0"
                          material="color: #f0c97d; roughness: 0.3; metalness: 0.4;"></a-circle>
                <a-circle position="0 5 -0.15" radius="0.8" rotation="90 0 0"
                          material="color: #f0c97d; roughness: 0.3; metalness: 0.4;"></a-circle>
            </a-entity>

            <!-- Main Hall Artworks (Left Wall) -->
            <a-entity position="0 0 0">
                <!-- Left Wall Artworks -->
                <a-entity position="-14.7 2.8 -4" rotation="0 90 0"
                    auto-frame="url: https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2340&q=80;
                                title: Замоскворечье;
                                artist: Алексей Саврасов, 1860;
                                description: <h3>О картине</h3><p>«Замоскворечье» — одна из самых известных картин Алексея Саврасова, написанная в 1860 году. Картина изображает пейзаж зимнего Подмосковья и считается одним из лучших примеров русского лирического пейзажа.</p><p>Саврасов был основоположником жанра зимнего русского пейзажа. На полотне перед зрителем предстает тихий зимний день в деревне Замоскворечье, расположенной недалеко от Москвы. Художник мастерски передает атмосферу покоя и умиротворения.</p><h3>Историческая значимость</h3><p>Эта картина сыграла важную роль в развитии русской живописи. Она стала одной из первых работ, где зима показана не как фон, а как полноценная тема произведения. Саврасов доказал, что зимний пейзаж может быть не менее выразительным, чем летний.</p>;
                                maxWidth: 5; maxHeight: 3.5">
                </a-entity>

                <a-entity position="-14.7 2.8 4" rotation="0 90 0"
                    auto-frame="url: https://images.unsplash.com/photo-1519501025264-65ba1c4ed6e8?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2368&q=80;
                                title: Крымский пейзаж;
                                artist: Фёдор Васильев, 1873;
                                description: <h3>О картине</h3><p>«Крымский пейзаж» Фёдора Васильева — это яркий пример лирического пейзажа, созданного в 1873 году. Картина изображает живописные места Крымского полуострова, которые особенно вдохновляли художников XIX века.</p><p>Васильев был известен своим умением передавать настроение природы. На этой картине он создает атмосферу умиротворения и гармонии. Пасторальные мотивы, характерные для его творчества, представлены в полной мере.</p><h3>Художественные особенности</h3><p>Картина отличается мягкостью красок и тонкостью колористики. Художник использовал преимущественно теплые тона, чтобы передать южное солнце и атмосферу Крыма. Особое внимание уделено светотени и атмосферному эффекту.</p>;
                                maxWidth: 5; maxHeight: 3.5">
                </a-entity>

                <a-entity position="-14.7 2.8 12" rotation="0 90 0"
                    auto-frame="url: https://dl.dropboxusercontent.com/scl/fi/0ufkhwqw4s5ghbo3iuedf/.jpg?rlkey=4p8nvcj2f1dlohe1y2vgc3llo&st=5qjnz9vz&raw=1;
                                title: Русские ворота в Анапе;
                                artist: Быков Артём;
                                description: <h3>О фотографии</h3><p><strong>Название:</strong> «Русские ворота в Анапе»</p><p><strong>Автор:</strong> Быков Артём</p><p>На фотографии запечатлены знаменитые Русские ворота — единственный сохранившийся фрагмент турецкой крепости, некогда возвышавшейся на месте современной Анапы. Этот исторический памятник является символом освобождения города от османского владычества.</p><h3>Историческая справка</h3><p><strong>Год постройки:</strong> 1783</p><p><strong>Первоначальное название:</strong> Ворота турецкой крепости Анапа</p><p><strong>Переименование:</strong> 1828 год — в чать взятия крепости русскими войсками</p><p><strong>Статус:</strong> Памятник архитектуры федерального значения</p><p>Турецкая крепость Анапа была построена в 1783 году по приказу султана Абдул-Хамида I для защиты северных рубежей Османской империи. Крепость имела <strong>семь бастионов</strong> и <strong>трое ворот</strong>. До наших дней сохранились лишь одни ворота — восточные.</p><h3>Архитектурные особенности</h3><p><strong>Стиль:</strong> Османская военная архитектура XVIII века</p><p><strong>Материал:</strong> Тёсаный камень-ракушечник</p><p><strong>Толщина стен:</strong> до 2 метров</p><p><strong>Высота арки:</strong> около 4,5 метров</p><p>Ворота представляют собой <em>массивную каменную арку</em> с полуциркульным сводом. Кладка выполнена из местного камня-ракушечника, характерного для черноморского побережья. Над аркой сохранились остатки зубчатого парапета — типичного элемента турецких крепостей.</p><h3>Название «Русские ворота»</h3><p>После окончательного взятия Анапы русскими войсками <strong>12 июня 1828 года</strong> турецкие ворота были переименованы в «Русские» — в память о храбрости солдат, штурмовавших неприступную крепость. На фасаде была установлена памятная плита с надписью:</p><p><em>«Русские ворота. Памятник османской военной архитектуры XVIII века. Взятие Анапы 12 июня 1828 года»</em>.</p><h3>Мемориальный комплекс</h3><p>Сегодня Русские ворота являются центром <strong>мемориального комплекса</strong>, включающего:</p><p>• <strong>Памятную стелу</strong> с надписью о взятии крепости</p><p>• <strong>Две старинные пушки</strong> — подлинные орудия времён Русско-турецких войн</p><p>• <strong>Цветочные клумбы</strong> и благоустроенную парковую зону</p><p>Внутри арки установлена памятная табличка, а рядом — информационные стенды об истории крепости.</p><h3>Символическое значение</h3><p>Русские ворота — это не просто архитектурный памятник. Это <strong>символ победы</strong>, напоминающий о многовековой борьбе за черноморское побережье. Они олицетворяют:</p><p>• <strong>Воинскую славу</strong> — память о солдатах, павших при штурмах Анапы</p><p>• <strong>Историческую преемственность</strong> — связь между эпохами</p><p>• <strong>Культурное наследие</strong> — уникальный образец османской архитектуры на территории России</p><h3>Туристическое значение</h3><p>Русские ворота — <strong>главная историческая достопримечательность Анапы</strong> и обязательный пункт посещения для туристов. Ежегодно тысячи гостей города фотографируются на фоне древней арки и знакомятся с историей края.</p><p>Памятник расположен в центре города, в сквере на пересечении улиц Пушкина и Крепостной.</p>;
                                maxWidth: 5; maxHeight: 3.5">

                                title: Летний пейзаж;

                                title: Осенний день;

                                description: <h3>О картине</h3><p>«Осенний день» Архипа Куинджи — одна из самых известных работ художника, написанная в 1879 году. Картина представляет собой яркий пример романтического пейзажа, в котором природа предстает как живое существо.</p><p>Куинджи был известен своей способностью передавать световые эффекты. На этой картине он создает ощущение движения облаков и изменения освещения. Особое внимание уделено передаче состояния природы в осеннее время года.</p><h3>Техника исполнения</h3><p>Художник использовал нестандартную технику нанесения краски, создавая текстуру и объем. Он часто работал с яркими акцентами света, чтобы подчеркнуть драматизм природной сцены. Эта картина демонстрирует мастерство Куинджи в работе с цветом и светом.</p>;
                                maxWidth: 5; maxHeight: 3.5">
                </a-entity>

                                title: Весна в деревне;
                                artist: Николай Ярошенко, 1888;
                                description: <h3>О картине</h3><p>«Весна в деревне» Николая Ярошенко — это трогательное произведение, созданное в 1888 году. Картина изображает пробуждение природы после долгой зимы и передает ощущение возрождения и надежды.</p><p>Ярошенко был известен своими социально-психологическими картинами, но в этой работе он выбрал пасторальный сюжет. Художник показывает простую деревенскую жизнь, но придает ей глубокое символическое значение. Весна здесь — не только время года, но и символ духовного обновления.</p><h3>Художественные особенности</h3><p>Картина отличается мягкой цветовой гаммой и светлыми тонами, характерными для весенней природы. Ярошенко использовал светлые мазки, чтобы передать ощущение свежести и чистоты. Особое внимание уделено деталям, которые создают атмосферу уюта и спокойствия.</p>;

                                title: Осень в лесу;

    // ============ LOADING & UI LOGIC ============
    window.addEventListener('load', () => {
        // Show enter button after a short delay
        setTimeout(() => {
            document.getElementById('enter-btn').style.display = 'block';
        }, 2000);
    });

    function enterMuseum() {
        const loadingScreen = document.getElementById('loading-screen');
        loadingScreen.classList.add('fade-out');
        
        // Remove loading screen after fade completes
        setTimeout(() => {
            loadingScreen.style.display = 'none';
        }, 1000);
    }

    // Raycast interaction feedback
    document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl) {
            sceneEl.addEventListener('mouseenter', (evt) => {
                if (evt.detail.intersectedEl) {
                    document.getElementById('painting-info').classList.add('visible');
                }
            });
            
            sceneEl.addEventListener('mouseleave', (evt) => {
                document.getElementById('painting-info').classList.remove('visible');
            });
        }
    });
    </script>
