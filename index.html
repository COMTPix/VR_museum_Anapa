    <title>VR Музей — Виртуальная Галерея</title>
    <meta aframe-injected="" name="mobile-web-app-capable" content="yes"><meta aframe-injected="" name="theme-color" content="black"><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><style>/* .a-fullscreen means not embedded. */
html.a-fullscreen {
  bottom: 0;
  left: 0;
  position: fixed;
  right: 0;
  top: 0;
}

html.a-fullscreen body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  padding: 0;
  width: 100%;
}

/* Class is removed when doing <a-scene embedded>. */
html.a-fullscreen .a-canvas {
  width: 100% !important;
  height: 100% !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  position: fixed !important;
}

html:not(.a-fullscreen) .a-enter-vr,
html:not(.a-fullscreen) .a-enter-ar {
  right: 5px;
  bottom: 5px;
}

html:not(.a-fullscreen) .a-enter-ar {
  right: 60px;
}

/* In chrome mobile the user agent stylesheet set it to white  */
:-webkit-full-screen {
  background-color: transparent;
}

.a-hidden {
  display: none !important;
}

.a-canvas {
  height: 100%;
  left: 0;
  position: absolute;
  top: 0;
  width: 100%;
}

.a-canvas.a-grab-cursor:hover {
  cursor: grab;
  cursor: -moz-grab;
  cursor: -webkit-grab;
}

canvas.a-canvas.a-mouse-cursor-hover:hover {
  cursor: pointer;
}

.a-inspector-loader {
  background-color: #ed3160;
  position: fixed;
  left: 3px;
  top: 3px;
  padding: 6px 10px;
  color: #fff;
  text-decoration: none;
  font-size: 12px;
  font-family: Roboto,sans-serif;
  text-align: center;
  z-index: 99999;
  width: 204px;
}

/* Inspector loader animation */
@keyframes dots-1 { from { opacity: 0; } 25% { opacity: 1; } }
@keyframes dots-2 { from { opacity: 0; } 50% { opacity: 1; } }
@keyframes dots-3 { from { opacity: 0; } 75% { opacity: 1; } }
@-webkit-keyframes dots-1 { from { opacity: 0; } 25% { opacity: 1; } }
@-webkit-keyframes dots-2 { from { opacity: 0; } 50% { opacity: 1; } }
@-webkit-keyframes dots-3 { from { opacity: 0; } 75% { opacity: 1; } }

.a-inspector-loader .dots span {
  animation: dots-1 2s infinite steps(1);
  -webkit-animation: dots-1 2s infinite steps(1);
}

.a-inspector-loader .dots span:first-child + span {
  animation-name: dots-2;
  -webkit-animation-name: dots-2;
}

.a-inspector-loader .dots span:first-child + span + span {
  animation-name: dots-3;
  -webkit-animation-name: dots-3;
}

a-scene {
  display: block;
  position: relative;
  height: 100%;
  width: 100%;
}

a-assets,
a-scene video,
a-scene img,
a-scene audio {
  display: none;
}

.a-enter-vr-modal,
.a-orientation-modal {
  font-family: Consolas, Andale Mono, Courier New, monospace;
}

.a-enter-vr-modal a {
  border-bottom: 1px solid #fff;
  padding: 2px 0;
  text-decoration: none;
  transition: .1s color ease-in;
}

.a-enter-vr-modal a:hover {
  background-color: #fff;
  color: #111;
  padding: 2px 4px;
  position: relative;
  left: -4px;
}

.a-enter-vr,
.a-enter-ar {
  font-family: sans-serif, monospace;
  font-size: 13px;
  width: 100%;
  font-weight: 200;
  line-height: 16px;
  position: absolute;
  right: 20px;
  bottom: 20px;
}

.a-enter-ar.xr {
  right: 90px;
}

.a-enter-vr-button,
.a-enter-vr-modal,
.a-enter-vr-modal a {
  color: #fff;
  user-select: none;
  outline: none;
}

.a-enter-vr-button,
.a-enter-ar-button {
  background-size: 90% 90%;
  border: 0;
  bottom: 0;
  cursor: pointer;
  min-width: 58px;
  min-height: 34px;
  /* 1.74418604651 */
  /*
    In order to keep the aspect ratio when resizing
    padding-top percentages are relative to the containing block's width.
    http://stackoverflow.com/questions/12121090/responsively-change-div-size-keeping-aspect-ratio
  */
  padding-right: 0;
  padding-top: 0;
  position: absolute;
  right: 0;
  transition: background-color .05s ease;
  -webkit-transition: background-color .05s ease;
  z-index: 9999;
  border-radius: 8px;
  touch-action: manipulation; /* Prevent iOS double tap zoom on the button */
}

.a-enter-ar-button {
  background-size: 100% 90%;
  border-radius: 7px;
}

.a-enter-ar-button:active,
.a-enter-ar-button:hover,
.a-enter-vr-button:active,
.a-enter-vr-button:hover {
  background-color: #ef2d5e;
}

.a-enter-vr-button.resethover {
  background-color: rgba(0, 0, 0, 0.35);
}

.a-enter-vr-modal {
  background-color: #666;
  border-radius: 0;
  display: none;
  min-height: 32px;
  margin-right: 70px;
  padding: 9px;
  width: 280px;
  right: 2%;
  position: absolute;
}

.a-enter-vr-modal:after {
  border-bottom: 10px solid transparent;
  border-left: 10px solid #666;
  border-top: 10px solid transparent;
  display: inline-block;
  content: '';
  position: absolute;
  right: -5px;
  top: 5px;
  width: 0;
  height: 0;
}

.a-enter-vr-modal p,
.a-enter-vr-modal a {
  display: inline;
}

.a-enter-vr-modal p {
  margin: 0;
}

.a-enter-vr-modal p:after {
  content: ' ';
}

<body>
    <!-- Info Modal -->
    <div id="modal-overlay" onclick="closeModal(event)">

                <p class="modal-desc" id="m-desc">Описание картины...</p>
            </div>
            <div class="modal-footer">

            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="fade-out" style="display: none;">
        <h1>🏛️ VR МУЗЕЙ</h1>
        <p>Виртуальная галерея искусств</p>
        <div class="loader" style="display: none;"></div>
        <button class="enter-btn" id="enter-btn" onclick="enterMuseum()" style="display: block;">ВОЙТИ В МУЗЕЙ</button>
    </div>

    <!-- UI Overlays -->
    <div id="crosshair"></div>
    <div id="info-panel" style="transition: opacity 2s; opacity: 0; display: none;">
        <span>WASD</span> — движение &nbsp;|&nbsp; <span>Мышь</span> — осмотр &nbsp;|&nbsp; <span>VR</span> — шлем
    </div>
    <div id="painting-info"></div>

    <script>
    // ============ GLOBAL MODAL FUNCTIONS ============
    function showPaintingInfo(title, artist, desc) {
        document.getElementById('m-title').innerText = title || "Без названия";
        document.getElementById('m-artist').innerText = artist || "Неизвестный автор";
        document.getElementById('m-desc').innerHTML = desc || "Информация скоро появится.";
        
        const overlay = document.getElementById('modal-overlay');
        overlay.style.display = 'flex';
        // Small delay to allow display:flex to apply before opacity transition
        requestAnimationFrame(() => {
            overlay.classList.add('active');
        });
        
        // Exit pointer lock so user can use mouse
        if (document.pointerLockElement) {
            document.exitPointerLock();
        }
    }

    function closeModal(e) {
        if (e.target.id === 'modal-overlay') {
            closeModalDirect();
        }
    }
    
    function closeModalDirect() {
        const overlay = document.getElementById('modal-overlay');
        overlay.classList.remove('active');
        setTimeout(() => {
            overlay.style.display = 'none';
            // Optional: return focus to canvas
            const scene = document.querySelector('a-scene');
            if (scene && scene.canvas) scene.canvas.focus();
        }, 300);
    }

    // ============ REGISTER auto-frame COMPONENT ============
    AFRAME.registerComponent('auto-frame', {
        schema: {
            url:       { type: 'string', default: '' },
            title:     { type: 'string', default: '' },
            artist:    { type: 'string', default: '' },
            description: { type: 'string', default: '' },
            maxWidth:  { type: 'number', default: 4.0 },
            maxHeight: { type: 'number', default: 3.5 },
            frameDepth:{ type: 'number', default: 0.18 }
        },

        init: function () {
            const data = this.data;

            if (data.url && data.url.length > 0) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const aspect = img.naturalWidth / img.naturalHeight;
                    this.buildFrame(aspect, data, true, img);
                };
                img.onerror = () => {
                    this.buildFrame(4/3, data, false, null);
                };
                img.src = data.url;
            } else {
                this.buildFrame(4/3, data, false, null);
            }
        },

        buildFrame: function (aspect, data, hasImage, imgElement) {
            const el = this.el;
            const maxW = data.maxWidth;
            const maxH = data.maxHeight;
            const fd = data.frameDepth;

            // Calculate canvas size
            let canvasW, canvasH;
            if (aspect >= 1) {
                canvasW = Math.min(maxW, maxH * aspect);
                canvasH = canvasW / aspect;
                if (canvasH > maxH) { canvasH = maxH; canvasW = canvasH * aspect; }
            } else {
                canvasH = Math.min(maxH, maxW / aspect);
                canvasW = canvasH * aspect;
                if (canvasW > maxW) { canvasW = maxW; canvasH = canvasW / aspect; }
            }

            const border = 0.25;
            const frameW = canvasW + border * 2;
            const frameH = canvasH + border * 2;

            // ---- LAYERS (Clean Z-separation) ----
            const outer = document.createElement('a-box');
            outer.setAttribute('width', frameW + 0.15);
            outer.setAttribute('height', frameH + 0.15);
            outer.setAttribute('depth', fd);
            outer.setAttribute('position', '0 0 0');
            el.appendChild(outer);
            outer.addEventListener('loaded', () => {
                const mesh = outer.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#6B4F1D', roughness: 0.25, metalness: 0.65 });
            });

            const mid = document.createElement('a-box');
            mid.setAttribute('width', frameW + 0.05);
            mid.setAttribute('height', frameH + 0.05);
            mid.setAttribute('depth', fd * 0.6);
            mid.setAttribute('position', '0 0 ' + (fd * 0.35));
            el.appendChild(mid);
            mid.addEventListener('loaded', () => {
                const mesh = mid.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#DAA520', roughness: 0.35, metalness: 0.55 });
            });

            const inner = document.createElement('a-box');
            inner.setAttribute('width', frameW - 0.05);
            inner.setAttribute('height', frameH - 0.05);
            inner.setAttribute('depth', fd * 0.4);
            inner.setAttribute('position', '0 0 ' + (fd * 0.55));
            el.appendChild(inner);
            inner.addEventListener('loaded', () => {
                const mesh = inner.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#8B6914', roughness: 0.25, metalness: 0.6 });
            });

            const lip = document.createElement('a-box');
            lip.setAttribute('width', canvasW + 0.08);
            lip.setAttribute('height', canvasH + 0.08);
            lip.setAttribute('depth', fd * 0.25);
            lip.setAttribute('position', '0 0 ' + (fd * 0.7));
            el.appendChild(lip);
            lip.addEventListener('loaded', () => {
                const mesh = lip.getObject3D('mesh');
                if (mesh) mesh.material = new THREE.MeshStandardMaterial({ color: '#B8860B', roughness: 0.3, metalness: 0.7 });
            });

            // Canvas
            const canvasZ = fd * 0.95; 
            const canvas = document.createElement('a-plane');
            canvas.setAttribute('width', canvasW);
            canvas.setAttribute('height', canvasH);
            canvas.setAttribute('position', '0 0 ' + canvasZ);
            canvas.setAttribute('class', 'clickable'); // Enable raycasting
            
            // Interaction
            if (hasImage) {
                canvas.addEventListener('click', () => {
                    showPaintingInfo(data.title, data.artist, data.description);
                });
                
                canvas.addEventListener('mouseenter', () => {
                    document.body.style.cursor = 'pointer';
                    light.setAttribute('intensity', '3.5');
                });
                canvas.addEventListener('mouseleave', () => {
                    document.body.style.cursor = 'default';
                    light.setAttribute('intensity', '2.5');
                });
            }

            if (hasImage && imgElement) {
                const tex = new THREE.Texture(imgElement);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.minFilter = THREE.LinearMipmapLinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = true;
                tex.anisotropy = 16;
                tex.needsUpdate = true;

                canvas.addEventListener('loaded', () => {
                     const mesh = canvas.getObject3D('mesh');
                     if (mesh) {
                         mesh.material = new THREE.MeshBasicMaterial({
                             map: tex,
                             toneMapped: false,
                             side: THREE.DoubleSide
                         });
                     }
                });
            } else {
                canvas.setAttribute('material', 'color: #050505; roughness: 0.95');
            }
            el.appendChild(canvas);

            // === Spotlight ===
            const light = document.createElement('a-light');
            light.setAttribute('type', 'spot');
            light.setAttribute('color', '#FFF8E7');
            light.setAttribute('intensity', '2.5');
            light.setAttribute('distance', '8');
            light.setAttribute('angle', '50');
            light.setAttribute('penumbra', '0.4');
            light.setAttribute('position', '0 ' + (frameH/2 + 2) + ' 3');
            light.setAttribute('target', canvas);
            el.appendChild(light);

            // === Label plate (Enhanced) ===
            if (data.title || data.artist) {
                const labelW = Math.max(2.0, canvasW * 0.8);
                const labelH = 0.6; // Bigger plaque
                const labelGroup = document.createElement('a-entity');
                labelGroup.setAttribute('position', '0 ' + (-(frameH/2) - 0.5) + ' ' + (fd * 0.5));

                // Gold border/base
                const labelBg = document.createElement('a-box');
                labelBg.setAttribute('width', labelW);
                labelBg.setAttribute('height', labelH);
                labelBg.setAttribute('depth', 0.04);
                labelBg.setAttribute('material', 'color: #B8860B; roughness: 0.3; metalness: 0.8');
                labelGroup.appendChild(labelBg);
                
                // Black inner face
                const labelFace = document.createElement('a-plane');
                labelFace.setAttribute('width', labelW - 0.05);
                labelFace.setAttribute('height', labelH - 0.05);
                labelFace.setAttribute('position', '0 0 0.025');
                labelFace.setAttribute('material', 'color: #050505; roughness: 0.8');
                labelGroup.appendChild(labelFace);

                if (data.title) {
                    const titleText = document.createElement('a-text');
                    titleText.setAttribute('value', data.title);
                    titleText.setAttribute('align', 'center');
                    titleText.setAttribute('color', '#ffffff');
                    titleText.setAttribute('width', labelW * 0.9);
                    titleText.setAttribute('wrap-count', '25');
                    titleText.setAttribute('position', '0 0.1 0.03');
                    titleText.setAttribute('font', 'https://cdn.aframe.io/fonts/Exo2Bold.fnt');
                    labelGroup.appendChild(titleText);
                }
                if (data.artist) {
                    const artistText = document.createElement('a-text');
                    artistText.setAttribute('value', data.artist);
                    artistText.setAttribute('align', 'center');
                    artistText.setAttribute('color', '#DAA520'); // Gold text
                    artistText.setAttribute('width', labelW * 0.9);
                    artistText.setAttribute('wrap-count', '30');
                    artistText.setAttribute('position', '0 -0.12 0.03');
                    artistText.setAttribute('font', 'https://cdn.aframe.io/fonts/Exo2SemiBold.fnt');
                    labelGroup.appendChild(artistText);
                }
                el.appendChild(labelGroup);
            }

            // === Corner ornaments ===
            const cornerZ = fd * 0.85;
            const corners = [
                { x: -(frameW/2 - 0.05), y:  (frameH/2 - 0.05) },
                { x:  (frameW/2 - 0.05), y:  (frameH/2 - 0.05) },
                { x: -(frameW/2 - 0.05), y: -(frameH/2 - 0.05) },
                { x:  (frameW/2 - 0.05), y: -(frameH/2 - 0.05) }
            ];
            corners.forEach(c => {
                const orn = document.createElement('a-sphere');
                orn.setAttribute('radius', 0.07);
                orn.setAttribute('position', c.x + ' ' + c.y + ' ' + cornerZ);
                orn.setAttribute('material', 'color: #DAA520; metalness: 0.8; roughness: 0.15');
                el.appendChild(orn);
            });
        }
    });

    // ============ REGISTER dust-particles COMPONENT ============
    AFRAME.registerComponent('dust-particles', {
        init: function () {
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('a-sphere');
                particle.setAttribute('radius', Math.random() * 0.02 + 0.005);
                particle.setAttribute('position', {
                    x: (Math.random() - 0.5) * 28,
                    y: Math.random() * 7 + 0.5,
                    z: (Math.random() - 0.5) * 48
                });
                particle.setAttribute('material', {
                    color: '#FFF8E7',
                    opacity: Math.random() * 0.25 + 0.08,
                    transparent: true
                });
                particle.setAttribute('animation', {
                    property: 'position.y',
                    dir: 'alternate',
                    dur: Math.random() * 6000 + 3000,
                    easing: 'easeInOutSine',
                    loop: true,
                    to: Math.random() * 7 + 0.5
                });
                this.el.appendChild(particle);
            }
        }
    });
    </script>

        <a-entity position="-14.7 2.8 -20" rotation="0 90 0" auto-frame="url: https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/After_the_attack._Plevna%2C_1877-1878.jpg/1280px-After_the_attack._Plevna%2C_1877-1878.jpg; 
                        title: После атаки. Перевязочный пункт под Плевной; 
                        artist: Василий Васильевич Верещагин, 1881; 
                        description: &lt;h3&gt;О картине&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Полное название:&lt;/strong&gt; «После атаки. Перевязочный пункт под Плевной»&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Год создания:&lt;/strong&gt; 1881 год&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Техника:&lt;/strong&gt; Холст, масло&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Размеры:&lt;/strong&gt; 183 × 234 см&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Местонахождение:&lt;/strong&gt; Государственная Третьяковская галерея, Москва&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Жанр:&lt;/strong&gt; Батальная живопись (реалистическое направление)&lt;/p&gt;&lt;h3&gt;Исторический контекст&lt;/h3&gt;&lt;p&gt;Картина изображает события &lt;strong&gt;Русско-турецкой войны 1877–1878 годов&lt;/strong&gt;. Конкретно — последствия &lt;em&gt;третьего штурма Плевны&lt;/em&gt;, предпринятого 30 августа 1877 года. Этот день был выбран не случайно: он совпадал с &lt;strong&gt;именинами императора Александра II&lt;/strong&gt;. Командование надеялось преподнести государю «подарок» в виде взятой крепости. Вместо этого — катастрофа: русская армия потеряла &lt;strong&gt;более 13 000 человек&lt;/strong&gt; убитыми и ранеными за один день.&lt;/p&gt;&lt;h3&gt;Композиция и сюжет&lt;/h3&gt;&lt;p&gt;Перед зрителем — &lt;strong&gt;импровизированный перевязочный пункт&lt;/strong&gt; близ деревни Горный Дубняк под Плевной. Бескрайнее серое небо сливается с раскисшей от крови и осенних дождей глиной. На переднем плане — &lt;strong&gt;сотни раненых солдат&lt;/strong&gt;, лежащих прямо на земле, без носилок, без палаток. Их так много, что немногочисленные врачи физически не успевают оказать помощь. Многие умрут здесь же, так и не дождавшись перевязки.&lt;/p&gt;&lt;p&gt;Верещагин намеренно избегает любой героизации. Здесь нет бравых офицеров, нет развевающихся знамён, нет победных жестов. Только &lt;strong&gt;страдание, усталость и смерть&lt;/strong&gt;. В центре композиции — фигура хирурга, склонившегося над очередным раненым. Его белый халат — единственное светлое пятно в этом море человеческого горя.&lt;/p&gt;&lt;h3&gt;Художественные особенности&lt;/h3&gt;&lt;p&gt;Верещагин использует &lt;strong&gt;приглушённую, почти монохромную палитру&lt;/strong&gt;: серо-коричневые, охристые, землистые тона. Это создаёт ощущение безнадёжности и уныния. Горизонтальный формат картины подчёркивает бескрайность поля страданий — оно уходит за пределы холста, намекая, что показанное — лишь малая часть трагедии.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Освещение&lt;/strong&gt; — рассеянное, пасмурное. Нет ни одного источника яркого света, что символизирует отсутствие надежды. Композиция построена так, что взгляд зрителя скользит по телам раненых, не находя точки покоя.&lt;/p&gt;&lt;h3&gt;Скандал и реакция власти&lt;/h3&gt;&lt;p&gt;Когда Александр II увидел это полотно на выставке, он пришёл в ярость. Художника обвинили в том, что он &lt;em&gt;«порочит честь русского мундира»&lt;/em&gt; и &lt;em&gt;«деморализует армию»&lt;/em&gt;. Верещагина называли смутьяном и предателем. Военное министерство требовало запретить показ картины. Но художник отвечал критикам с достоинством:&lt;/p&gt;&lt;p&gt;&lt;em&gt;«Я писал то, что видел своими глазами. Лгать в искусстве я не умею и не желаю. Пусть смотрят те, кто отправляет солдат умирать, — и видят, чего стоят их победы»&lt;/em&gt;.&lt;/p&gt;&lt;h3&gt;Значение для мировой культуры&lt;/h3&gt;&lt;p&gt;Сегодня «После атаки» признана &lt;strong&gt;одним из величайших антивоенных произведений&lt;/strong&gt; в истории мировой живописи. Вместе с другими работами Балканской серии она повлияла на формирование критического взгляда на войну в европейском искусстве и стала предвестником документальной военной фотографии XX века.&lt;/p&gt;;

        <a-entity position="-14.7 2.8 -12" rotation="0 90 0" auto-frame="url: https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/After_the_attack._Plevna%2C_1877-1878.jpg/1280px-After_the_attack._Plevna%2C_1877-1878.jpg; 
                        title: Василий Верещагин — Воин и Пацифист; 
                        artist: Биографическая справка (1842–1904); 
                        description: &lt;h3&gt;Человек-легенда&lt;/h3&gt;&lt;p&gt;Василий Васильевич Верещагин — одна из самых загадочных и противоречивых фигур в истории мирового искусства. Выпускник Морского кадетского корпуса, профессиональный военный, он всю жизнь ненавидел войну — и при этом провёл на полях сражений больше времени, чем любой другой художник в истории. Он участвовал в Туркестанских походах, Русско-турецкой и Русско-японской войнах, был ранен, награждён орденом Святого Георгия — и отказался от него.&lt;/p&gt;&lt;h3&gt;Философия творчества&lt;/h3&gt;&lt;p&gt;Верещагин считал своим священным долгом показывать войну такой, какая она есть: без прикрас, без героической позолоты, без парадных генералов на белых конях. &lt;em&gt;«Передо мной, как перед художником, война, и я её бью, сколько у меня есть сил»&lt;/em&gt;, — писал он. На раме своей знаменитой картины «Апофеоз войны» (пирамида черепов) он оставил посвящение: &lt;em&gt;«Всем великим завоевателям — прошедшим, настоящим и будущим»&lt;/em&gt;.&lt;/p&gt;&lt;h3&gt;Признание и преследование&lt;/h3&gt;&lt;p&gt;Его выставки в Европе собирали сотни тысяч посетителей. Немецкий генералитет требовал запретить показ его работ, считая их &lt;em&gt;«подрывающими боевой дух армии»&lt;/em&gt;. За свой вклад в дело мира Верещагин был номинирован на первую в истории Нобелевскую премию мира в 1901 году.&lt;/p&gt;&lt;h3&gt;Гибель художника&lt;/h3&gt;&lt;p&gt;31 марта 1904 года Верещагин находился на борту флагманского броненосца «Петропавловск» у берегов Порт-Артура. Корабль подорвался на японской мине и затонул за две минуты. Вместе с художником погибли адмирал Макаров и 650 матросов. Очевидцы утверждали, что в момент взрыва Верещагин стоял на палубе с альбомом в руках, делая зарисовки боя. Он ушёл под воду, как и жил — с карандашом в руке, лицом к войне.&lt;/p&gt;;

        <a-entity position="-14.7 2.8 -4" rotation="0 90 0" auto-frame="url: https://dl.dropboxusercontent.com/scl/fi/7gmbpqdczx2ogdiauwq49/.jpg?rlkey=nklwyvbelb6cdhblpykzro5i9&amp;st=1p3q2bf4&amp;raw=1; 
                        title: Памятник Ивану Гудовичу в Анапе; 
                        artist: Быков Артём; 
                        description: &lt;h3&gt;О картине&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Название:&lt;/strong&gt; «Памятник Ивану Гудовичу в городе Анапа»&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Автор:&lt;/strong&gt; Быков Артём&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Сюжет:&lt;/strong&gt; На картине изображён бронзовый памятник генерал-фельдмаршалу Ивану Васильевичу Гудовичу, установленный в городе Анапа. Монумент запечатлён на фоне южного неба, что подчёркивает величие фигуры полководца и его историческую связь с этим краем.&lt;/p&gt;&lt;h3&gt;О памятнике&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Дата установки:&lt;/strong&gt; 2011 год&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Скульптор:&lt;/strong&gt; Александр Аполлонов&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Расположение:&lt;/strong&gt; Центральная набережная Анапы, у входа в археологический музей «Горгиппия»&lt;/p&gt;&lt;p&gt;Памятник представляет собой бронзовую фигуру Гудовича в полный рост в парадном мундире с орденами и фельдмаршальским жезлом в руке. Полководец изображён в момент триумфа — взятия турецкой крепости Анапа. Постамент из красного гранита украшен барельефами, изображающими сцены штурма крепости.&lt;/p&gt;&lt;h3&gt;Генерал-фельдмаршал Иван Васильевич Гудович&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Годы жизни:&lt;/strong&gt; 1741–1820&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Звание:&lt;/strong&gt; Генерал-фельдмаршал Российской империи&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Титул:&lt;/strong&gt; Граф (с 1797 года)&lt;/p&gt;&lt;p&gt;Иван Васильевич Гудович — выдающийся русский военачальник, один из наиболее талантливых полководцев эпохи Екатерины II и Александра I. Родился в знатной украинской дворянской семье на Черниговщине.&lt;/p&gt;&lt;h3&gt;Взятие Анапы (1791)&lt;/h3&gt;&lt;p&gt;Главным подвигом Гудовича стал &lt;strong&gt;штурм турецкой крепости Анапа 22 июня 1791 года&lt;/strong&gt; — одна из самых блестящих побед Русско-турецкой войны 1787–1791 годов.&lt;/p&gt;&lt;p&gt;&lt;em&gt;Анапа считалась неприступной&lt;/em&gt; — мощные каменные стены, 95 орудий, гарнизон из 10 000 турок и 15 000 горцев. Гудович располагал лишь 7 000 солдат.&lt;/p&gt;&lt;p&gt;Штурм начался на рассвете. Русские войска атаковали одновременно с нескольких направлений. После &lt;strong&gt;пятичасового ожесточённого боя&lt;/strong&gt; крепость пала. Турки потеряли убитыми около 8 000 человек, в плен попали 13 500 человек, включая коменданта крепости. Русские потери составили около 3 500 человек.&lt;/p&gt;&lt;p&gt;За эту победу Екатерина II наградила Гудовича &lt;strong&gt;орденом Святого Георгия II степени&lt;/strong&gt; и золотой шпагой, украшенной бриллиантами, с надписью &lt;em&gt;«За храбрость»&lt;/em&gt;.&lt;/p&gt;&lt;h3&gt;Значение для истории Анапы&lt;/h3&gt;&lt;p&gt;Взятие Анапы Гудовичем положило начало &lt;strong&gt;окончательному присоединению Кубани к России&lt;/strong&gt;. Хотя по Ясскому миру 1791 года крепость была возвращена Турции, русские войска возвращались сюда ещё дважды — в 1807 и 1828 годах. Окончательно Анапа стала российской в 1829 году.&lt;/p&gt;&lt;p&gt;Сегодня Гудович почитается как &lt;strong&gt;освободитель Анапы&lt;/strong&gt;. Его имя носит одна из улиц города, а памятник стал одной из главных достопримечательностей курорта.&lt;/p&gt;&lt;h3&gt;Другие заслуги&lt;/h3&gt;&lt;p&gt;Помимо взятия Анапы, Гудович прославился как &lt;strong&gt;главнокомандующий на Кавказе&lt;/strong&gt; (1806–1809), где вёл успешные боевые действия против Персии и горских племён. Также занимал пост &lt;strong&gt;генерал-губернатора Москвы&lt;/strong&gt; (1809–1812), где провёл важные реформы городского управления.&lt;/p&gt;&lt;p&gt;Скончался в 1820 году в возрасте 79 лет. Похоронен в Киево-Печерской лавре.&lt;/p&gt;;

        <a-entity position="-14.7 2.8 4" rotation="0 90 0" auto-frame="url: https://dl.dropboxusercontent.com/scl/fi/zvw5w9r8ufg04m3hf34x9/main.jpg?rlkey=6fvvs234gr67rgcsutvcelyjo&amp;st=5atybb6s&amp;raw=1; 
                        title: Триумфальная арка в Анапе; 
                        artist: Быков Артём; 
                        description: &lt;h3&gt;О фотографии&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Название:&lt;/strong&gt; «Триумфальная арка в Анапе»&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Автор:&lt;/strong&gt; Быков Артём&lt;/p&gt;&lt;p&gt;На фотографии запечатлена величественная Триумфальная арка — одна из главных достопримечательностей города-курорта Анапа. Монументальное сооружение возвышается на фоне южного неба, символизируя гостеприимство и торжественность черноморского курорта.&lt;/p&gt;&lt;h3&gt;О Триумфальной арке&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Расположение:&lt;/strong&gt; Центральная набережная Анапы, у входа в парк «Ореховая роща»&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Год установки:&lt;/strong&gt; 2015&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Высота:&lt;/strong&gt; около 8 метров&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Материал:&lt;/strong&gt; Белый мрамор и гранит&lt;/p&gt;&lt;p&gt;Триумфальная арка в Анапе — это современный архитектурный символ города, созданный в классическом римском стиле. Арка выполнена из белого камня и украшена декоративными элементами, характерными для античной архитектуры: колоннами коринфского ордера, барельефами и орнаментальной лепниной.&lt;/p&gt;&lt;h3&gt;Архитектурные особенности&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Стиль:&lt;/strong&gt; Неоклассицизм с элементами античной архитектуры&lt;/p&gt;&lt;p&gt;Арка имеет &lt;em&gt;три пролёта&lt;/em&gt; — центральный широкий для прохода и два боковых узких. Венчает конструкцию массивный аттик с надписью «АНАПА». По бокам расположены парные колонны с каннелюрами (вертикальными желобками), увенчанные капителями с акантовыми листьями.&lt;/p&gt;&lt;p&gt;Белоснежный цвет арки символизирует &lt;strong&gt;чистоту черноморских пляжей&lt;/strong&gt; и создаёт эффектный контраст с ярко-синим южным небом. В вечернее время арка подсвечивается, становясь центром притяжения для прогулок.&lt;/p&gt;&lt;h3&gt;Символическое значение&lt;/h3&gt;&lt;p&gt;Триумфальные арки издревле служили символом &lt;strong&gt;победы, славы и торжества&lt;/strong&gt;. В контексте Анапы арка олицетворяет:&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Исторические победы&lt;/strong&gt; — память о взятии турецкой крепости русскими войсками&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Курортный триумф&lt;/strong&gt; — превращение Анапы в один из лучших курортов России&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Гостеприимство&lt;/strong&gt; — торжественный вход в город для миллионов туристов&lt;/p&gt;&lt;h3&gt;Туристическое значение&lt;/h3&gt;&lt;p&gt;Сегодня Триумфальная арка — это &lt;strong&gt;визитная карточка Анапы&lt;/strong&gt; и одно из самых фотографируемых мест курорта. Ежегодно тысячи туристов делают памятные снимки на её фоне. Арка стала неотъемлемой частью свадебных фотосессий и городских праздников.&lt;/p&gt;&lt;p&gt;Рядом с аркой расположены главные достопримечательности: набережная, маяк, музей «Горгиппия» и памятник основателю города.&lt;/p&gt;;

        <a-entity position="-14.7 2.8 12" rotation="0 90 0" auto-frame="url: https://dl.dropboxusercontent.com/scl/fi/0ufkhwqw4s5ghbo3iuedf/.jpg?rlkey=4p8nvcj2f1dlohe1y2vgc3llo&amp;st=5qjnz9vz&amp;raw=1; 
                        title: Русские ворота в Анапе; 
                        artist: Быков Артём; 
                        description: &lt;h3&gt;О фотографии&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Название:&lt;/strong&gt; «Русские ворота в Анапе»&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Автор:&lt;/strong&gt; Быков Артём&lt;/p&gt;&lt;p&gt;На фотографии запечатлены знаменитые Русские ворота — единственный сохранившийся фрагмент турецкой крепости, некогда возвышавшейся на месте современной Анапы. Этот исторический памятник является символом освобождения города от османского владычества.&lt;/p&gt;&lt;h3&gt;Историческая справка&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Год постройки:&lt;/strong&gt; 1783&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Первоначальное название:&lt;/strong&gt; Ворота турецкой крепости Анапа&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Переименование:&lt;/strong&gt; 1828 год — в честь взятия крепости русскими войсками&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Статус:&lt;/strong&gt; Памятник архитектуры федерального значения&lt;/p&gt;&lt;p&gt;Турецкая крепость Анапа была построена в 1783 году по приказу султана Абдул-Хамида I для защиты северных рубежей Османской империи. Крепость имела &lt;strong&gt;семь бастионов&lt;/strong&gt; и &lt;strong&gt;трое ворот&lt;/strong&gt;. До наших дней сохранились лишь одни ворота — восточные.&lt;/p&gt;&lt;h3&gt;Архитектурные особенности&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Стиль:&lt;/strong&gt; Османская военная архитектура XVIII века&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Материал:&lt;/strong&gt; Тёсаный камень-ракушечник&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Толщина стен:&lt;/strong&gt; до 2 метров&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Высота арки:&lt;/strong&gt; около 4,5 метров&lt;/p&gt;&lt;p&gt;Ворота представляют собой &lt;em&gt;массивную каменную арку&lt;/em&gt; с полуциркульным сводом. Кладка выполнена из местного камня-ракушечника, характерного для черноморского побережья. Над аркой сохранились остатки зубчатого парапета — типичного элемента турецких крепостей.&lt;/p&gt;&lt;h3&gt;Название «Русские ворота»&lt;/h3&gt;&lt;p&gt;После окончательного взятия Анапы русскими войсками &lt;strong&gt;12 июня 1828 года&lt;/strong&gt; турецкие ворота были переименованы в «Русские» — в память о храбрости солдат, штурмовавших неприступную крепость. На фасаде была установлена памятная плита с надписью:&lt;/p&gt;&lt;p&gt;&lt;em&gt;«Русские ворота. Памятник османской военной архитектуры XVIII века. Взятие Анапы 12 июня 1828 года»&lt;/em&gt;.&lt;/p&gt;&lt;h3&gt;Мемориальный комплекс&lt;/h3&gt;&lt;p&gt;Сегодня Русские ворота являются центром &lt;strong&gt;мемориального комплекса&lt;/strong&gt;, включающего:&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Памятную стелу&lt;/strong&gt; с надписью о взятии крепости&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Две старинные пушки&lt;/strong&gt; — подлинные орудия времён Русско-турецких войн&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Цветочные клумбы&lt;/strong&gt; и благоустроенную парковую зону&lt;/p&gt;&lt;p&gt;Внутри арки установлена памятная табличка, а рядом — информационные стенды об истории крепости.&lt;/p&gt;&lt;h3&gt;Символическое значение&lt;/h3&gt;&lt;p&gt;Русские ворота — это не просто архитектурный памятник. Это &lt;strong&gt;символ победы&lt;/strong&gt;, напоминающий о многовековой борьбе за черноморское побережье. Они олицетворяют:&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Воинскую славу&lt;/strong&gt; — память о солдатах, павших при штурмах Анапы&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Историческую преемственность&lt;/strong&gt; — связь между эпохами&lt;/p&gt;&lt;p&gt;• &lt;strong&gt;Культурное наследие&lt;/strong&gt; — уникальный образец османской архитектуры на территории России&lt;/p&gt;&lt;h3&gt;Туристическое значение&lt;/h3&gt;&lt;p&gt;Русские ворота — &lt;strong&gt;главная историческая достопримечательность Анапы&lt;/strong&gt; и обязательный пункт посещения для туристов. Ежегодно тысячи гостей города фотографируются на фоне древней арки и знакомятся с историей края.&lt;/p&gt;&lt;p&gt;Памятник расположен в центре города, в сквере на пересечении улиц Пушкина и Крепостной.&lt;/p&gt;;

    <script>
        // Loading screen logic
        const scene = document.getElementById('scene');
        const loadingScreen = document.getElementById('loading-screen');
        const enterBtn = document.getElementById('enter-btn');

        scene.addEventListener('loaded', () => {
            setTimeout(() => {
                enterBtn.style.display = 'block';
                document.querySelector('.loader').style.display = 'none';
            }, 1500);
        });

        setTimeout(() => {
            enterBtn.style.display = 'block';
            document.querySelector('.loader').style.display = 'none';
        }, 5000);

        function enterMuseum() {
            loadingScreen.classList.add('fade-out');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 1000);

            const canvas = scene.canvas;
            if (canvas) {
                canvas.addEventListener('click', () => {
                    canvas.requestPointerLock();
                });
            }
        }

        // Boost renderer quality after scene loads
        scene.addEventListener('loaded', () => {
            const renderer = scene.renderer;
            if (renderer) {
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;
            }
        });

        // Hide info panel after 8 seconds
        setTimeout(() => {
            const infoPanel = document.getElementById('info-panel');
            infoPanel.style.transition = 'opacity 2s';
            infoPanel.style.opacity = '0';
            setTimeout(() => { infoPanel.style.display = 'none'; }, 2000);
        }, 8000);
    </script>
